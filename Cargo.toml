[package]
name = "taskestra"
version = "1.0.0"
edition = "2024"
description = "Taskestra — tasks, natively on Omarchy"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
rusqlite = { version = "0.40", features = ["bundled"] }
glib-unix = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "none"
# Line tables keep core dumps and panics readable (file:line per frame).
debug = "line-tables-only"
panic = "abort"
