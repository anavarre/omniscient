[package]
name = "omniscient"
version = "0.1.0"
edition = "2024"
description = "Omniscient — tasks, projects and collaborators, natively on Omarchy"
license = "MIT"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
notify = { version = "8", default-features = false }
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
# Line tables keep core dumps and panics readable (file:line per frame).
debug = "line-tables-only"
panic = "abort"
